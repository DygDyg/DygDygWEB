<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zapret GUI</title>
  <style>
    :root {
      --bg0: #0e1520;
      --bg1: #162033;
      --text: #e8eef8;
      --muted: #8b9bb4;
      --accent: #3dff8a;
      --accent-dim: #1a8f4a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% -10%, #1c3a2a 0%, transparent 55%),
        radial-gradient(700px 420px at 90% 10%, #1a2740 0%, transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }
    main {
      min-height: 100vh;
      display: grid;
      place-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .ver {
      margin: 0 0 1.6rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .ver b {
      color: var(--accent);
      font-weight: 600;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-width: 12rem;
      padding: 0.85rem 1.4rem;
      border-radius: 10px;
      text-decoration: none;
      color: #04140a;
      font-weight: 700;
      font-size: 1.05rem;
      background: linear-gradient(180deg, #5dff9f, var(--accent));
      box-shadow: 0 10px 28px rgba(61, 255, 138, 0.22);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    a.btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }
    a.btn:active { transform: translateY(0); }
    .hint {
      margin: 1.1rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Zapret GUI</h1>
    <p class="ver">Версия: <b id="ver">2026-10-01 01:36:36</b></p>
    <a class="btn" id="dl" href="ZapretGUI.exe" download="ZapretGUI.exe">Скачать</a>
    <p class="hint">Windows · запуск от имени администратора</p>
  </main>
  <script>
    (function () {
      var el = document.getElementById("ver");
      fetch("ver.txt", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
        .then(function (t) {
          var v = (t || "").trim();
          if (v) el.textContent = v;
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
