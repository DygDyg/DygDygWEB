# Snippet for the `server.dygdyg.ru` HTTPS server block.
# Put it inside:
#
# server {
#     server_name server.dygdyg.ru dygdyg.duckdns.org x.duckdns.org;
#     root /var/www/html;
#     ...
# }
#
# Important: do not send `Access-Control-Allow-Credentials: true` together with
# `Access-Control-Allow-Origin: *`. NewTab API uses bearer tokens, not cookies.

location ^~ /newtab/api/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-NewTab-Auth" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-NewTab-Auth" always;

    try_files $uri =404;

    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

