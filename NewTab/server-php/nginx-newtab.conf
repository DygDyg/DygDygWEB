# Snippet for the `server.dygdyg.ru` HTTPS server block.
# Put it inside:
#
# server {
#     server_name server.dygdyg.ru dygdyg.duckdns.org x.duckdns.org;
#     root /var/www/html;
#     ...
# }
#
# Important: this block intentionally does not add CORS headers. PHP already
# sends them. If nginx sends them too, Chrome sees duplicate headers and blocks
# the response.

location ^~ /newtab/api/ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}
