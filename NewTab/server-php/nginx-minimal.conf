# Minimal nginx block for NewTab PHP scripts.
#
# Use this instead of nginx-newtab.conf if browser still shows CORS while
# token.php returns 200 OK. In that case CORS headers are probably duplicated:
# nginx sends them once, PHP sends them again, and Chrome rejects the response.
#
# Put this location inside the HTTPS `server { ... }` block for server.dygdyg.ru,
# above the generic `location ~ \.php$`.

location ^~ /newtab/api/ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

